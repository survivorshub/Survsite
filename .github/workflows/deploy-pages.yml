name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  JEKYLL_ENV: production

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show tool versions
        run: |
          node --version

      - name: Install cspell
        run: npm install -g cspell@latest

      - name: Check spelling in posts
        run: |
          cspell --config .cspell.json --no-progress --words-only --locale es "blog-tech/_posts/**/*.md" || true
          echo "⚠️ Spellcheck completed with warnings only."

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: blog-tech

      - name: Show tool versions
        run: |
          ruby --version
          bundle --version

      - name: Install Jekyll dependencies
        working-directory: blog-tech
        run: bundle install

      - name: Run Jekyll doctor
        working-directory: blog-tech
        run: bundle exec jekyll doctor

      - name: Validate Jekyll build
        working-directory: blog-tech
        run: bundle exec jekyll build --trace

      - name: Validation summary
        run: |
          echo "✅ Validación completada. El sitio está listo para desplegar."
          test -f blog-tech/_site/index.html
          echo "📦 Artefacto de build generado en blog-tech/_site"

  build:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: blog-tech

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site with Jekyll
        working-directory: blog-tech
        run: bundle exec jekyll build --trace

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blog-tech/_site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
