name: Enforce PR merges on main

on:
  workflow_dispatch:

jobs:
  require-pr-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure main only accepts PR merge commits
        run: |
          echo "Commit SHA: ${{ github.sha }}"
          PULLS=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[].number' 2>/dev/null || true)
          if [ -z "$PULLS" ]; then
            PULLS=$(gh pr list --search "${{ github.sha }}" --state all --json number --jq '.[0].number' 2>/dev/null || true)
          fi
          echo "PRs asociados: ${PULLS:-ninguno}"
          if [ -n "$PULLS" ]; then
            echo "✅ El push a main proviene de un merge vía PR."
          else
            echo "❌ Los pushes directos a main no están permitidos. Crea una rama y fusiona mediante PR."
            exit 1
          fi
