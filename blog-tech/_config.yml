title: "Bitácora Tech"
description: "Un blog colectivo de amigos apasionados por la tecnología: desarrollo, IA, seguridad, gaming, hardware y más."
baseurl: "/Survsite"
url: "https://survivorshub.github.io"
future: true

# Autores del blog (edita con los datos de tus amigos)
authors:
  juanjo:
    name: "Juanjo Morales"
    bio: "Ingeniero de sistemas"
  mauro:
    name: "Mauro Fernández"
    bio: "Arquitecto Devops"
  mario:
    name: "Mario Parra"
    bio: "Ciberseguridad"

# Tema y plugins
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

paginate: 6
paginate_path: "/page:num/"

# Menú de navegación
header_pages:
  - about.md
  - posts.md

markdown: kramdown
permalink: /:categories/:year/:month/:day/:title/
